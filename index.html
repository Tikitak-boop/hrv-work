<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HRV Work</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:#050505;color:#fff;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  }
  canvas{display:block;width:100%;height:100%}
  #ui{position:fixed;inset:0;pointer-events:none}
  #topbar{
    position:fixed;top:12px;left:12px;right:12px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px
  }
  #leftControls,#rightInfo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:auto}
  button{
    border:1px solid rgba(255,255,255,.14);
    background:rgba(18,22,28,.67);
    color:#fff;border-radius:14px;padding:12px 16px;
    font-size:16px;font-weight:650;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
  }
  button:disabled{opacity:.45}
  .chip{
    padding:9px 12px;border-radius:999px;font-size:12px;line-height:1;
    color:rgba(255,255,255,.9);background:rgba(0,0,0,.22);
    border:1px solid rgba(255,255,255,.1)
  }
  #statusLine{
    position:fixed;top:62px;left:50%;transform:translateX(-50%);
    font:11px/1.3 "SF Mono",Menlo,Consolas,monospace;
    color:rgba(255,255,255,.30);text-align:center;white-space:nowrap
  }
  #center{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    text-align:center;user-select:none
  }
  #bpm{
    font:120px/.95 "SF Mono",Menlo,Consolas,monospace;
    color:rgba(255,255,255,.13);letter-spacing:-3px;
    font-variant-numeric:tabular-nums;
    transition:color .18s ease,text-shadow .18s ease,transform .08s ease
  }
  #centerLabel{
    margin-top:8px;font:13px/1 "SF Mono",Menlo,Consolas,monospace;
    color:rgba(255,255,255,.32);letter-spacing:.2em;text-transform:uppercase
  }
  #thresholdLabel{
    margin-top:13px;font:12px/1 "SF Mono",Menlo,Consolas,monospace;
    color:rgba(255,255,255,.60);letter-spacing:.08em
  }
  #bottom{
    position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    width:min(94vw,900px);display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));gap:10px
  }
  .card{
    padding:14px 14px 12px;border-radius:16px;
    background:rgba(5,8,12,.48);
    border:1px solid rgba(255,255,255,.09);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
  }
  .label{
    font:11px/1.2 "SF Mono",Menlo,Consolas,monospace;
    color:rgba(255,255,255,.48);letter-spacing:.08em;text-transform:uppercase
  }
  .value{
    margin-top:6px;font-size:28px;font-weight:760;
    color:rgba(255,255,255,.96);font-variant-numeric:tabular-nums
  }
  .unit{font-size:14px;color:rgba(255,255,255,.58);font-weight:500}
  #progress{margin-top:9px;height:8px;width:100%;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden}
  #progressFill{width:0%;height:100%;background:rgba(255,255,255,.85);transition:width .4s ease}
  #legend{
    position:fixed;right:16px;bottom:16px;
    font:11px/1.35 "SF Mono",Menlo,Consolas,monospace;
    color:rgba(255,255,255,.20);text-align:right
  }
  @media(max-width:820px){
    #bpm{font-size:92px}
    #bottom{grid-template-columns:repeat(2,minmax(0,1fr));width:min(94vw,640px)}
  }
  @media(max-width:520px){
    #bpm{font-size:72px;letter-spacing:-1px}
    button{padding:11px 13px;font-size:15px}
    #statusLine{top:112px;padding:0 18px;white-space:normal;width:100%}
    #bottom{grid-template-columns:1fr 1fr;bottom:10px;gap:8px}
    .value{font-size:22px}
    #legend{display:none}
  }
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">

<body>
<canvas id="c"></canvas>

<div id="ui">
  <div id="topbar">
    <div id="leftControls">
      <button id="connectBtn">Connetti Polar H10</button>
      <button id="audioBtn" disabled>Audio: OFF</button>
    </div>
    <div id="rightInfo">
      <div class="chip" id="audioChip">OFF</div>
      <div class="chip" id="bandChip">—</div>
    </div>
  </div>

  <div id="statusLine">Pronto. Connetti il Polar H10.</div>

  <div id="center">
    <div id="bpm">--</div>
    <div id="centerLabel">heart rhythm</div>
    <div id="thresholdLabel">RMSSD —</div>
  </div>

  <div id="bottom">
    <div class="card">
      <div class="label">RMSSD</div>
      <div class="value"><span id="rmssdVal">--</span> <span class="unit">ms</span></div>
      <div id="progress"><div id="progressFill"></div></div>
    </div>
    <div class="card">
      <div class="label">RR ultimo</div>
      <div class="value"><span id="rrVal">--</span> <span class="unit">ms</span></div>
    </div>
    <div class="card">
      <div class="label">Fascia</div>
      <div class="value" style="font-size:22px"><span id="bandVal">—</span></div>
    </div>
    <div class="card">
      <div class="label">RR validi</div>
      <div class="value"><span id="countVal">0</span></div>
    </div>
  </div>

  <div id="legend">Audio: OFF → BLEND → HARMONY → NATURE</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d',{alpha:false});
  const connectBtn = document.getElementById('connectBtn');
  const audioBtn = document.getElementById('audioBtn');
  const bpmEl = document.getElementById('bpm');
  const statusLine = document.getElementById('statusLine');
  const rmssdVal = document.getElementById('rmssdVal');
  const rrVal = document.getElementById('rrVal');
  const countVal = document.getElementById('countVal');
  const progressFill = document.getElementById('progressFill');
  const bandVal = document.getElementById('bandVal');
  const bandChip = document.getElementById('bandChip');
  const audioChip = document.getElementById('audioChip');
  const thresholdLabel = document.getElementById('thresholdLabel');

  let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  function resize(){
    W=innerWidth;H=innerHeight;
    canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize();addEventListener('resize',resize);

  // Six discrete RMSSD bands.
  const BANDS = [
    {min:-Infinity,max:20, label:'< 20',     name:'Molto basso',  bg:[92,10,18],  glow:[255,55,65],  root:110.00, ratios:[1,1.1892,1.4142,1.6818]},
    {min:20,max:30,       label:'20–30',    name:'Basso',        bg:[126,38,14], glow:[255,105,45], root:116.54, ratios:[1,1.20,1.50,1.80]},
    {min:30,max:40,       label:'30–40',    name:'Medio-basso',  bg:[153,82,8],  glow:[255,160,55], root:123.47, ratios:[1,1.25,1.50,1.875]},
    {min:40,max:50,       label:'40–50',    name:'Medio',        bg:[151,132,8], glow:[255,225,70], root:130.81, ratios:[1,1.333,1.50,2.00]},
    {min:50,max:60,       label:'50–60',    name:'Buono',        bg:[89,131,19], glow:[178,235,75], root:146.83, ratios:[1,1.25,1.50,2.00]},
    {min:60,max:Infinity, label:'> 60',      name:'Alto',         bg:[13,105,53], glow:[80,235,135], root:164.81, ratios:[1,1.25,1.50,2.00]}
  ];

  function getBandIndex(v){
    for(let i=0;i<BANDS.length;i++){
      if(v>=BANDS[i].min && v<BANDS[i].max) return i;
    }
    return 0;
  }

  let currentHR=0,currentRMSSD=0,rrHistory=[];
  let beatPulse=0;
  let currentBand=-1;
  let targetBand=0;
  let bgMix=1;
  let previousBg=[25,10,12];
  let targetBg=BANDS[0].bg.slice();

  const rings=[];
  const particles=[];
  for(let i=0;i<105;i++){
    particles.push({
      a:Math.random()*Math.PI*2,
      r:80+Math.random()*420,
      speed:(Math.random()*.18+.06)*(Math.random()<.5?-1:1),
      size:Math.random()*2.3+.45,
      alpha:Math.random()*.38+.05,
      wobble:Math.random()*.9+.2,
      z:Math.random()
    });
  }

  function median(a){
    const b=[...a].sort((x,y)=>x-y),n=b.length;
    return n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2;
  }
  function validRR(rr){
    if(rr<350||rr>1600)return false;
    if(rrHistory.length<5)return true;
    const m=median(rrHistory.slice(-7));
    return Math.abs(rr-m)<=m*.22;
  }
  function calcRMSSD(a){
    if(a.length<4)return null;
    let s=0,n=0;
    for(let i=1;i<a.length;i++){const d=a[i]-a[i-1];s+=d*d;n++}
    return Math.sqrt(s/n);
  }
  function chimeLevel(v){return Math.max(0,Math.min(1,(v-15)/70))}

  // ----- AUDIO ------------------------------------------------------------
  let audioCtx=null;
  let audioMode=0; // 0=OFF, 1=BLEND, 2=HARMONY, 3=NATURE
  const MODE_NAMES=['OFF','BLEND','HARMONY','NATURE'];

  function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
  function rmssdNorm(v){return clamp((v-15)/55,0,1)}
  function ensureAudio(){
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }

  // BLEND: harmonic pad + chime on each accepted RR.
  let blendBus=null;
  let blendOscs=null;
  let blendFilters=null;

  function ensureBlendPad(){
    if(blendOscs)return;
    blendBus=audioCtx.createGain();
    blendBus.gain.value=.0001;
    blendBus.connect(audioCtx.destination);

    blendOscs=[];blendFilters=[];
    for(let i=0;i<4;i++){
      const o=audioCtx.createOscillator();
      const f=audioCtx.createBiquadFilter();
      f.type='lowpass';f.frequency.value=1000;f.Q.value=.45;
      o.type=i<2?'sine':'triangle';
      o.connect(f);f.connect(blendBus);
      o.start();
      blendOscs.push(o);blendFilters.push(f);
    }
  }

  function setBlendForBand(index,announce){
    if(audioMode!==1||!audioCtx)return;
    ensureBlendPad();
    const b=BANDS[index];
    const now=audioCtx.currentTime;

    blendOscs.forEach((o,i)=>{
      const target=b.root*b.ratios[i];
      o.frequency.cancelScheduledValues(now);
      o.frequency.setTargetAtTime(target,now,.22);
      blendFilters[i].frequency.setTargetAtTime(700+index*230,now,.28);
    });
    blendBus.gain.setTargetAtTime(.026+index*.004,now,.30);

    if(announce) playBlendTransition(index);
  }

  function playBlendTransition(index){
    const b=BANDS[index];
    const now=audioCtx.currentTime;

    b.ratios.slice(0,3).forEach((ratio,i)=>{
      const o=audioCtx.createOscillator();
      const g=audioCtx.createGain();
      const f=audioCtx.createBiquadFilter();
      f.type='lowpass';f.frequency.value=1700+index*180;
      o.type=i===0?'sine':'triangle';
      o.frequency.setValueAtTime(b.root*ratio,now);
      o.frequency.exponentialRampToValueAtTime(b.root*ratio*1.012,now+.42);
      g.gain.setValueAtTime(.0001,now);
      g.gain.exponentialRampToValueAtTime(.065/(i+1),now+.025);
      g.gain.exponentialRampToValueAtTime(.0001,now+.70+i*.10);
      o.connect(f);f.connect(g);g.connect(audioCtx.destination);
      o.start(now);o.stop(now+.95);
    });

    const low=audioCtx.createOscillator();
    const lowG=audioCtx.createGain();
    low.type='sine';
    low.frequency.setValueAtTime(b.root/2,now);
    lowG.gain.setValueAtTime(.0001,now);
    lowG.gain.exponentialRampToValueAtTime(.045,now+.02);
    lowG.gain.exponentialRampToValueAtTime(.0001,now+.48);
    low.connect(lowG);lowG.connect(audioCtx.destination);
    low.start(now);low.stop(now+.55);
  }

  function playBlendChime(rmssd){
    if(audioMode!==1||!audioCtx)return;
    const x=chimeLevel(rmssd);
    const now=audioCtx.currentTime;
    const base=420+x*520;

    [1,1.5,2.02].forEach((mult,i)=>{
      const o=audioCtx.createOscillator();
      const g=audioCtx.createGain();
      o.type=i===0?'sine':'triangle';
      o.frequency.value=base*mult;
      g.gain.setValueAtTime(.0001,now);
      g.gain.exponentialRampToValueAtTime(.07/(i+1),now+.012);
      g.gain.exponentialRampToValueAtTime(.0001,now+.52+i*.17);
      o.connect(g);g.connect(audioCtx.destination);
      o.start(now);o.stop(now+.95);
    });
  }

  function stopBlendPad(){
    if(blendBus&&audioCtx){
      blendBus.gain.cancelScheduledValues(audioCtx.currentTime);
      blendBus.gain.setTargetAtTime(.0001,audioCtx.currentTime,.10);
    }
  }

  // HARMONY: continuous value feedback.
  // Every new RMSSD value retunes the harmony; no quantisation to the six bands.
  let harmonyBus=null;
  let harmonyOscs=null;
  let harmonyFilters=null;
  let harmonyPans=null;

  function ensureHarmonyPad(){
    if(harmonyOscs)return;

    harmonyBus=audioCtx.createGain();
    harmonyBus.gain.value=.0001;
    harmonyBus.connect(audioCtx.destination);

    harmonyOscs=[];
    harmonyFilters=[];
    harmonyPans=[];

    for(let i=0;i<4;i++){
      const o=audioCtx.createOscillator();
      const f=audioCtx.createBiquadFilter();
      const p=audioCtx.createStereoPanner();

      o.type=i<2?'sine':'triangle';
      f.type='lowpass';
      f.frequency.value=1100;
      f.Q.value=.35;

      o.connect(f);
      f.connect(p);
      p.connect(harmonyBus);
      o.start();

      harmonyOscs.push(o);
      harmonyFilters.push(f);
      harmonyPans.push(p);
    }
  }

  function harmonyShape(rmssd){
    // Continuous mapping: every distinct RMSSD creates a slightly different chord.
    const n=clamp((rmssd-10)/70,0,1);

    // Pitch rises gradually with RMSSD.
    const root=108*Math.pow(2,n*.42);

    // Tense intervals continuously resolve toward consonant intervals.
    const r2=(16/15)+((5/4)-(16/15))*n;
    const r3=(7/5)+((3/2)-(7/5))*n;
    const r4=1.82+(2.0-1.82)*n;

    return {
      n,
      root,
      ratios:[1,r2,r3,r4],
      cutoff:650+n*2850,
      spread:.08+n*.52,
      gain:.016+n*.016
    };
  }

  function updateHarmony(rmssd,withPulse=true){
    if(audioMode!==2||!audioCtx||!Number.isFinite(rmssd))return;
    ensureHarmonyPad();

    const s=harmonyShape(rmssd);
    const now=audioCtx.currentTime;
    const pans=[-s.spread,s.spread,-s.spread*.35,s.spread*.35];

    harmonyOscs.forEach((o,i)=>{
      const freq=s.root*s.ratios[i];
      o.frequency.cancelScheduledValues(now);
      o.frequency.setTargetAtTime(freq,now,.18);
      harmonyFilters[i].frequency.setTargetAtTime(s.cutoff,now,.20);
      harmonyPans[i].pan.setTargetAtTime(pans[i],now,.22);
    });

    harmonyBus.gain.setTargetAtTime(s.gain,now,.22);

    if(withPulse)playHarmonyValuePulse(rmssd,s);
  }

  function playHarmonyValuePulse(rmssd,shape=null){
    if(audioMode!==2||!audioCtx)return;
    const s=shape||harmonyShape(rmssd);
    const now=audioCtx.currentTime;

    // The pulse pitch also follows the exact RMSSD value, so even changes
    // inside the same threshold band remain audible.
    const pulseRoot=260+s.n*440;
    const ratios=[1,s.ratios[1],s.ratios[2]];

    ratios.forEach((ratio,i)=>{
      const o=audioCtx.createOscillator();
      const g=audioCtx.createGain();
      const f=audioCtx.createBiquadFilter();
      const p=audioCtx.createStereoPanner();

      o.type=i===0?'sine':'triangle';
      o.frequency.setValueAtTime(pulseRoot*ratio,now);
      f.type='bandpass';
      f.frequency.value=pulseRoot*ratio;
      f.Q.value=4.8-i*.8;
      p.pan.value=(i-1)*s.spread*.55;

      g.gain.setValueAtTime(.0001,now);
      g.gain.exponentialRampToValueAtTime((.050+s.n*.018)/(i+1),now+.012);
      g.gain.exponentialRampToValueAtTime(.0001,now+.30+i*.07);

      o.connect(f);
      f.connect(p);
      p.connect(g);
      g.connect(audioCtx.destination);

      o.start(now);
      o.stop(now+.56);
    });
  }

  function stopHarmony(){
    if(harmonyBus&&audioCtx){
      harmonyBus.gain.cancelScheduledValues(audioCtx.currentTime);
      harmonyBus.gain.setTargetAtTime(.0001,audioCtx.currentTime,.12);
    }
  }

  const natureTracks=natureFiles.map(file=>{
    const a=new Audio(file);
    a.loop=true;
    a.preload='auto';
    a.volume=0;
    return a;
  });
  let natureActiveIndex=-1;
  let natureFadeToken=0;

  function stopNature(fadeMs=800){
    const token=++natureFadeToken;
    const start=performance.now();
    const starts=natureTracks.map(a=>a.volume);
    function step(now){
      if(token!==natureFadeToken)return;
      const t=Math.min(1,(now-start)/fadeMs);
      natureTracks.forEach((a,i)=>a.volume=starts[i]*(1-t));
      if(t<1){
        requestAnimationFrame(step);
      }else{
        natureTracks.forEach(a=>{a.pause();a.volume=0});
        natureActiveIndex=-1;
      }
    }
    requestAnimationFrame(step);
  }

  async function switchNatureBand(index,fadeMs=3500){
    if(audioMode!==3||index<0)return;
    if(natureActiveIndex===index)return;

    const token=++natureFadeToken;
    const oldIndex=natureActiveIndex;
    const next=natureTracks[index];

    try{
      if(next.paused){
        if(Number.isFinite(next.duration)&&next.duration>2){
          next.currentTime=Math.random()*Math.max(1,next.duration-1);
        }
        next.volume=0;
        await next.play();
      }
    }catch(e){
      statusLine.textContent='Errore audio NATURE: '+e.message;
      return;
    }

    natureActiveIndex=index;
    const old=oldIndex>=0?natureTracks[oldIndex]:null;
    const oldStart=old?old.volume:0;
    const start=performance.now();

    function step(now){
      if(token!==natureFadeToken)return;
      const t=Math.min(1,(now-start)/fadeMs);
      const eased=t*t*(3-2*t);
      next.volume=.72*eased;
      if(old)old.volume=oldStart*(1-eased);

      if(t<1){
        requestAnimationFrame(step);
      }else if(old){
        old.pause();old.volume=0;
      }
    }
    requestAnimationFrame(step);
  }

  function cleanupAudioForModeChange(previousMode,nextMode){
    if(previousMode===1&&nextMode!==1)stopBlendPad();
    if(previousMode===2&&nextMode!==2)stopHarmony();
    if(previousMode===3&&nextMode!==3)stopNature();
  }

  audioBtn.addEventListener('click',async()=>{
    ensureAudio();
    if(audioCtx.state==='suspended')await audioCtx.resume();

    const previousMode=audioMode;
    audioMode=(audioMode+1)%MODE_NAMES.length;
    cleanupAudioForModeChange(previousMode,audioMode);

    audioBtn.textContent='Audio: '+MODE_NAMES[audioMode];
    audioChip.textContent=MODE_NAMES[audioMode];

    const idx=currentBand>=0?currentBand:0;
    if(audioMode===1){
      setBlendForBand(idx,false);
    }else if(audioMode===2){
      // HARMONY starts from the exact latest RMSSD, not the band midpoint.
      updateHarmony(currentRMSSD||35,false);
      if(currentRMSSD)playHarmonyValuePulse(currentRMSSD);
    }else if(audioMode===3){
      await switchNatureBand(idx,900);
    }
  });

  function handleBeatAudio(rmssd){
    if(audioMode===1){
      playBlendChime(rmssd);
    }else if(audioMode===2){
      updateHarmony(rmssd,true);
    }
  }

  // ----- BAND CHANGE ------------------------------------------------------
  function changeBand(index){
    if(index===currentBand)return;
    const old=currentBand;
    currentBand=index;

    const b=BANDS[index];
    previousBg = getCurrentBg();
    targetBg=b.bg.slice();
    bgMix=0;

    bandVal.textContent=b.label;
    bandChip.textContent=b.label;
    thresholdLabel.textContent='RMSSD '+b.label+' · '+b.name;

    if(audioMode===1){
      setBlendForBand(index,old!==-1);
    }else if(audioMode===3){
      switchNatureBand(index,old===-1?900:3500);
    }

    // Strong visual ring at threshold transition.
    rings.push({r:18,a:1,w:5,bandChange:true});
  }

  function getCurrentBg(){
    return [
      Math.round(previousBg[0]+(targetBg[0]-previousBg[0])*bgMix),
      Math.round(previousBg[1]+(targetBg[1]-previousBg[1])*bgMix),
      Math.round(previousBg[2]+(targetBg[2]-previousBg[2])*bgMix)
    ];
  }

  function updateUI(){
    bpmEl.textContent=currentHR||'--';
    rmssdVal.textContent=currentRMSSD?currentRMSSD.toFixed(1):'--';
    countVal.textContent=rrHistory.length;
    progressFill.style.width=Math.min(100,Math.max(0,currentRMSSD/80*100)).toFixed(0)+'%';
  }

  function onBeat(){
    beatPulse=1;
    rings.push({r:10,a:.78,w:1.7,bandChange:false});
    if(rings.length>28)rings.shift();

    const b=BANDS[Math.max(0,currentBand)];
    const c=b.glow;
    bpmEl.style.color=`rgba(${c[0]},${c[1]},${c[2]},.22)`;
    bpmEl.style.textShadow=`0 0 30px rgba(${c[0]},${c[1]},${c[2]},.18)`;
    bpmEl.style.transform='scale(1.045)';
    setTimeout(()=>bpmEl.style.transform='scale(1)',90);
  }

  // ----- BLUETOOTH --------------------------------------------------------
  function parseHeartRate(value){
    let o=0,flags=value.getUint8(o++);
    let hr;
    if(flags&1){hr=value.getUint16(o,true);o+=2}else{hr=value.getUint8(o++)}
    if(flags&8)o+=2;
    const rrs=[];
    if(flags&16){
      while(o+1<value.byteLength){
        const raw=value.getUint16(o,true);o+=2;
        rrs.push(raw/1024*1000);
      }
    }
    return{hr,rrs};
  }

  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));

  async function connectGattWithRetry(device,attempts=4){
    let lastError=null;
    for(let attempt=1;attempt<=attempts;attempt++){
      try{
        if(device.gatt.connected)return device.gatt;
        statusLine.textContent=attempt===1
          ? 'Connessione...'
          : 'Riprovo connessione '+attempt+'/'+attempts+'...';
        return await device.gatt.connect();
      }catch(e){
        lastError=e;
        if(attempt<attempts)await wait(900+attempt*650);
      }
    }
    throw lastError||new Error('Connection failed');
  }

  connectBtn.addEventListener('click',async()=>{
    try{
      if(!navigator.bluetooth){
        throw new Error('Web Bluetooth non disponibile. Apri la pagina in Chrome Android via HTTPS.');
      }

      statusLine.textContent='Ricerca Polar H10...';
      const device=await navigator.bluetooth.requestDevice({
        filters:[
          {namePrefix:'Polar H10'},
          {services:['heart_rate']}
        ],
        optionalServices:['heart_rate']
      });

      const server=await connectGattWithRetry(device,4);

      statusLine.textContent='Apro servizio cardiaco...';
      const service=await server.getPrimaryService('heart_rate');
      const ch=await service.getCharacteristic('heart_rate_measurement');

      statusLine.textContent='Attivo dati HR/RR...';
      await ch.startNotifications();

      ch.addEventListener('characteristicvaluechanged',ev=>{
        const {hr,rrs}=parseHeartRate(ev.target.value);
        currentHR=hr||currentHR;

        for(const rr of rrs){
          if(!validRR(rr))continue;
          rrHistory.push(rr);
          if(rrHistory.length>60)rrHistory.shift();
          rrVal.textContent=Math.round(rr);

          const r=calcRMSSD(rrHistory);
          if(r!==null){
            currentRMSSD=r;
            const idx=getBandIndex(r);
            changeBand(idx);
            updateUI();
            onBeat();
            handleBeatAudio(r);
          }
        }
        if(!rrs.length)updateUI();
      });

      device.addEventListener('gattserverdisconnected',()=>{
        statusLine.textContent='Polar disconnesso · premi Connetti per riprovare';
        audioBtn.disabled=true;
        stopBlendPad();
        stopHarmony();
        if(audioMode===3)stopNature();
      });

      audioBtn.disabled=false;
      statusLine.textContent='Polar H10 connesso';
      updateUI();

    }catch(e){
      const msg=(e&&e.message)?e.message:String(e);
      if(/cancel|chooser|user cancelled|canceled/i.test(msg)){
        statusLine.textContent='Connessione annullata';
      }else if(/connection failed|connect/i.test(msg)){
        statusLine.textContent='Connection failed · chiudi altre app Polar/HRV e riprova';
      }else{
        statusLine.textContent='Errore: '+msg;
      }
    }
  });

  // ----- VISUALS ----------------------------------------------------------
  function drawBackground(){
    if(bgMix<1)bgMix=Math.min(1,bgMix+.018); // smooth threshold color transition
    const bg=getCurrentBg();
    const b=BANDS[Math.max(0,currentBand)];
    const glow=b.glow;

    const g=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H)*.72);
    g.addColorStop(0,`rgb(${Math.min(255,bg[0]+16)},${Math.min(255,bg[1]+14)},${Math.min(255,bg[2]+12)})`);
    g.addColorStop(.48,`rgb(${Math.round(bg[0]*.58)},${Math.round(bg[1]*.58)},${Math.round(bg[2]*.58)})`);
    g.addColorStop(1,'rgb(4,4,5)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    const r=Math.min(W,H)*(.10+beatPulse*.025);
    const gg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,r*3.2);
    gg.addColorStop(0,`rgba(${glow[0]},${glow[1]},${glow[2]},${.14+beatPulse*.09})`);
    gg.addColorStop(.42,`rgba(${glow[0]},${glow[1]},${glow[2]},.055)`);
    gg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(W/2,H/2,r*3.2,0,Math.PI*2);ctx.fill();
  }

  function drawParticles(t){
    const b=BANDS[Math.max(0,currentBand)];
    const c=b.glow;
    const x0=W/2,y0=H/2;
    for(const p of particles){
      p.a+=p.speed*.004;
      const wob=Math.sin(t*.0007*p.wobble+p.r*.01)*8;
      const x=x0+Math.cos(p.a)*(p.r+wob);
      const y=y0+Math.sin(p.a)*(p.r+wob*.65);
      ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${p.alpha+beatPulse*.035})`;
      ctx.beginPath();ctx.arc(x,y,p.size+beatPulse*.35*p.z,0,Math.PI*2);ctx.fill();
    }
  }

  function drawRings(){
    const b=BANDS[Math.max(0,currentBand)];
    const c=b.glow;
    for(let i=rings.length-1;i>=0;i--){
      const r=rings[i];
      r.r+=r.bandChange?5.2:3.5;
      r.a*=r.bandChange?.974:.962;
      if(r.a<.012){rings.splice(i,1);continue}
      ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${r.a})`;
      ctx.lineWidth=r.w;
      ctx.beginPath();ctx.arc(W/2,H/2,r.r,0,Math.PI*2);ctx.stroke();
    }
  }

  function drawRadials(t){
    const b=BANDS[Math.max(0,currentBand)];
    const c=b.glow;
    ctx.save();ctx.translate(W/2,H/2);
    const count=20;
    for(let i=0;i<count;i++){
      const a=Math.PI*2*i/count+t*.00005*(i%2?1:-1);
      const base=Math.min(W,H)*.17;
      const len=12+beatPulse*(i%3===0?15:5);
      ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},.10)`;
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*base,Math.sin(a)*base);
      ctx.lineTo(Math.cos(a)*(base+len),Math.sin(a)*(base+len));
      ctx.stroke();
    }
    ctx.restore();
  }

  function animate(t){
    drawBackground();
    drawParticles(t);
    drawRadials(t);
    drawRings();
    beatPulse*=.92;
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>
